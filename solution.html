<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>题解 | 30天编程挑战</title>
    <script src="https://cdn.jsdelivr.net/npm/marked@15.0.7/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css">
    <script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.97);
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            padding: 40px;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 32px;
            flex-wrap: wrap;
            gap: 12px;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
        }
        .back-link:hover { color: #5568d3; }

        .difficulty-badge {
            padding: 4px 14px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .difficulty-badge.HARD   { background: #ff6b6b; color: white; }
        .difficulty-badge.MEDIUM { background: #ffd93d; color: #333; }
        .difficulty-badge.EASY   { background: #6bcb77; color: white; }

        .solution-title {
            font-size: 2rem;
            font-weight: 700;
            color: #333;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .meta-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
            flex-wrap: wrap;
        }

        .problem-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }
        .problem-link:hover { text-decoration: underline; }

        .status-message {
            text-align: center;
            padding: 80px 20px;
            color: #6c757d;
            font-size: 1.1rem;
        }
        .status-message .spinner {
            display: inline-block;
            width: 32px; height: 32px;
            border: 3px solid #e9ecef;
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .markdown-body {
            color: #333;
            line-height: 1.8;
            font-size: 1rem;
        }
        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4 {
            margin-top: 1.5em;
            margin-bottom: 0.6em;
            font-weight: 700;
            color: #222;
            line-height: 1.3;
        }
        .markdown-body h1 { font-size: 1.7rem; border-bottom: 2px solid #667eea; padding-bottom: 6px; }
        .markdown-body h2 { font-size: 1.4rem; }
        .markdown-body h3 { font-size: 1.15rem; }

        .markdown-body p { margin-bottom: 1em; }

        .markdown-body ul,
        .markdown-body ol { padding-left: 1.5em; margin-bottom: 1em; }
        .markdown-body li { margin-bottom: 0.3em; }

        .markdown-body strong { font-weight: 700; color: #111; }

        .markdown-body code {
            background: #f0f2f5;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            font-family: 'JetBrains Mono', 'Fira Code', 'Consolas', monospace;
            color: #e74c3c;
        }

        .markdown-body pre {
            background: #f6f8fa;
            border-radius: 10px;
            padding: 18px 20px;
            overflow-x: auto;
            margin-bottom: 1.2em;
            border: 1px solid #e9ecef;
        }
        .markdown-body pre code {
            background: none;
            padding: 0;
            color: inherit;
            font-size: 0.88em;
            line-height: 1.6;
        }

        .markdown-body table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1.2em;
            font-size: 0.92em;
        }
        .markdown-body th,
        .markdown-body td {
            border: 1px solid #dee2e6;
            padding: 10px 14px;
            text-align: left;
        }
        .markdown-body th {
            background: #f0f2f5;
            font-weight: 600;
            color: #333;
        }
        .markdown-body tr:nth-child(even) td { background: #f8f9fa; }

        .markdown-body blockquote {
            border-left: 4px solid #667eea;
            padding: 10px 16px;
            margin: 1em 0;
            background: #f0f2ff;
            border-radius: 0 8px 8px 0;
            color: #555;
        }

        .markdown-body hr {
            border: none;
            border-top: 2px solid #e9ecef;
            margin: 2em 0;
        }

        .markdown-body img { max-width: 100%; border-radius: 8px; }

        .markdown-body a { color: #667eea; }
        .markdown-body a:hover { text-decoration: underline; }

        .markdown-body pre {
            position: relative;
        }
        @media (max-width: 768px) {
            .container { padding: 24px 18px; }
            .solution-title { font-size: 1.5rem; }
            .markdown-body { font-size: 0.95rem; }
            .markdown-body table { font-size: 0.82em; }
            .markdown-body pre { padding: 14px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav-bar">
            <a href="index.html" class="back-link">← 返回题目列表</a>
            <span class="difficulty-badge" id="difficultyBadge"></span>
        </div>

        <h1 class="solution-title" id="solutionTitle"></h1>
        <div class="meta-row">
            <a class="problem-link" id="problemLink" target="_blank">去做题 →</a>
        </div>

        <div class="markdown-body" id="solutionContent">
            <div class="status-message">
                <div class="spinner"></div>
                <div>加载题解中...</div>
            </div>
        </div>
    </div>

    <script>
        (function () {
            const params = new URLSearchParams(window.location.search);
            const slug = params.get('slug');
            const rawTitle = params.get('title') || '';
            const difficulty = params.get('difficulty') || '';

            if (!slug) {
                document.getElementById('solutionContent').innerHTML =
                    '<div class="status-message">缺少题目标识，无法加载题解。</div>';
                return;
            }

            document.title = (rawTitle || slug) + ' | 题解';
            document.getElementById('solutionTitle').textContent = rawTitle || slug;

            const badge = document.getElementById('difficultyBadge');
            if (difficulty) {
                badge.textContent = difficulty;
                badge.className = 'difficulty-badge ' + difficulty;
            } else {
                badge.style.display = 'none';
            }

            document.getElementById('problemLink').href =
                'https://leetcode.cn/problems/' + slug + '/';

            const mdPath = 'solutions/' + slug + '.md';
            fetch(mdPath)
                .then(function (res) {
                    if (!res.ok) throw new Error('Not found');
                    return res.text();
                })
                .then(function (mdText) {
                    const html = marked.parse(mdText, { breaks: true, gfm: true });
                    var container = document.getElementById('solutionContent');
                    container.innerHTML = html;

                    container.querySelectorAll('pre code').forEach(function (block) {
                        hljs.highlightElement(block);
                    });
                })
                .catch(function () {
                    document.getElementById('solutionContent').innerHTML =
                        '<div class="status-message">暂无题解<br><span style="font-size:0.85rem;color:#999;">题解正在路上，敬请期待</span></div>';
                });
        })();
    </script>
</body>
</html>
